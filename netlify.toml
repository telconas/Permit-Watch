# Netlify detects Next.js and adds its Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The scraper's browser runs in GitHub Actions, never on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NEXT_TELEMETRY_DISABLED = "1"
