name: Morning digest

# Calls the site's digest endpoint, which emails each subscriber their new matches.
# Does nothing until the SITE_URL and CRON_SECRET secrets exist (i.e. once accounts are set up).
on:
  schedule:
    # 11:00 UTC = 7 AM EDT / 6 AM EST. Change to '0 12 * * *' in winter for 7 AM year-round.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET not set yet; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/digest"
